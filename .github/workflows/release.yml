name: Release

# Self-contained r2fuse binaries: radare2 (GPL build, with the grub plugins)
# and libfuse are linked statically, so nothing but the OS FUSE provider is
# needed at runtime (Fusetta on macOS, /dev/fuse on Linux, WinFsp on Windows).

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      r2_ref:
        description: 'radare2 branch, tag or commit (empty uses the pinned revision)'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Includes the APFS registration and bundled-lz4 Meson fixes.
  R2_REF: ${{ github.event.inputs.r2_ref || '7be472225088ea025d71d65ac5b617336b35c772' }}
  FUSETTA_REF: 08f1dd86b03844c8e8eb8ddc9972cac755a272fb
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static binary (alpine/musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e R2_REF alpine:3.22 sh -c '
            apk add --no-cache build-base linux-headers meson ninja git pkgconf curl patch file &&
            git config --global --add safe.directory "*" &&
            ./dist/static.sh'
          sudo chown -R "$(id -u):$(id -g)" .
          file r2fuse
          ! ldd r2fuse 2>/dev/null
      - name: Smoke test
        run: |
          git -c core.protectNTFS=false clone --depth 1 --filter=blob:none --no-checkout https://github.com/radareorg/radare2-testbins testbins
          git -C testbins -c core.protectNTFS=false sparse-checkout set fs && git -C testbins -c core.protectNTFS=false checkout
          ./r2fuse -v
          ./test/run.sh testbins/fs
      - name: Package
        run: |
          d=r2fuse-$VERSION-linux-${{ matrix.arch }}
          mkdir $d && cp r2fuse README.md LICENSE FSTODO.md $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: r2fuse-*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install meson ninja
      - name: Build static binary (Fusetta libfuse)
        run: |
          ./dist/static.sh
          # only system libraries and frameworks are allowed
          ! otool -L r2fuse | tail -n +2 | grep -vE '^[[:space:]]+/(usr/lib|System)/'
      - name: Smoke test
        run: |
          git -c core.protectNTFS=false clone --depth 1 --filter=blob:none --no-checkout https://github.com/radareorg/radare2-testbins testbins
          git -C testbins -c core.protectNTFS=false sparse-checkout set fs && git -C testbins -c core.protectNTFS=false checkout
          ./r2fuse -v
          ./test/run.sh testbins/fs
      - name: Package
        run: |
          d=r2fuse-$VERSION-macos-arm64
          mkdir $d && cp r2fuse README.md LICENSE FSTODO.md $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: r2fuse-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Install build tools
        run: |
          pip install meson ninja
          choco install winfsp pkgconfiglite -y
      - name: Cache static radare2
        id: r2-cache
        uses: actions/cache@v4
        with:
          path: r2
          key: windows-x64-radare2-${{ env.R2_REF }}-c11-mt-v1
      - name: Build static radare2
        if: steps.r2-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git init r2src
          git -C r2src remote add origin https://github.com/radareorg/radare2
          git -C r2src fetch --depth 1 origin $env:R2_REF
          git -C r2src checkout --detach FETCH_HEAD
          # Use the conforming preprocessor and r2's portable tokenizer for APFS.
          meson setup r2build r2src "--prefix=$PWD/r2" --libdir=lib --buildtype=release --default-library=static -Dcli=disabled -Denable_tests=false -Db_vscrt=mt -Dc_std=c11 "-Dc_args=['/Zc:preprocessor', '/Dstrtok_r=r_str_tok_r']"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ninja -C r2build install
      - name: Build static r2fuse
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "$PWD/r2/lib/pkgconfig"
          meson setup build --buildtype=release -Dstatic=true -Db_vscrt=mt -Dc_std=c11 -Dc_args=/Zc:preprocessor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson compile -C build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dumpbin /dependents build\r2fuse.exe
      - name: Smoke test
        shell: bash
        run: |
          git -c core.protectNTFS=false clone --depth 1 --filter=blob:none --no-checkout https://github.com/radareorg/radare2-testbins testbins
          git -C testbins -c core.protectNTFS=false sparse-checkout set fs && git -C testbins -c core.protectNTFS=false checkout
          ./build/r2fuse.exe -v
          ./build/r2fuse.exe -L
          for img in fat.img iso.img ext2.img; do
            ./build/r2fuse.exe -s "$(cygpath -w "$PWD/testbins/fs/$img")"
          done
      - name: Package
        shell: pwsh
        run: |
          $d = "r2fuse-$env:VERSION-windows-x64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item build\r2fuse.exe, README.md, LICENSE, FSTODO.md $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: r2fuse-*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check release assets and generate checksums
        working-directory: dist
        run: |
          test -s r2fuse-$VERSION-linux-x86_64.tar.gz
          test -s r2fuse-$VERSION-linux-arm64.tar.gz
          test -s r2fuse-$VERSION-macos-arm64.tar.gz
          test -s r2fuse-$VERSION-windows-x64.zip
          sha256sum r2fuse-*.tar.gz r2fuse-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: r2fuse ${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
