name: Release

# Portable archives: Linux links radare2 from git and libfuse statically;
# macOS and Windows bundle the libraries from a radare2 release.

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      r2_ref:
        description: 'radare2 branch, tag or commit (empty uses the pinned revision)'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Includes the APFS registration and bundled-lz4 Meson fixes.
  R2_REF: ${{ github.event.inputs.r2_ref || '7be472225088ea025d71d65ac5b617336b35c772' }}
  FUSETTA_REF: 08f1dd86b03844c8e8eb8ddc9972cac755a272fb
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static binary (alpine/musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e R2_REF alpine:3.22 sh -c '
            apk add --no-cache build-base linux-headers meson ninja git pkgconf curl patch file &&
            git config --global --add safe.directory "*" &&
            ./dist/static.sh'
          sudo chown -R "$(id -u):$(id -g)" .
          file r2fuse
          ! ldd r2fuse 2>/dev/null
      - name: Smoke test
        run: |
          git -c core.protectNTFS=false clone --depth 1 --filter=blob:none --no-checkout https://github.com/radareorg/radare2-testbins testbins
          git -C testbins -c core.protectNTFS=false sparse-checkout set fs && git -C testbins -c core.protectNTFS=false checkout
          ./r2fuse -v
          ./test/run.sh testbins/fs
      - name: Package
        run: |
          d=r2fuse-$VERSION-linux-${{ matrix.arch }}
          mkdir $d && cp r2fuse README.md LICENSE FSTODO.md $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: r2fuse-*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install meson ninja
      - name: Install radare2 release
        uses: radareorg/github-actions@v3
      - name: Build with release radare2 and static Fusetta libfuse
        env:
          R2_PREFIX: /usr/local
        run: |
          ./dist/static.sh
      - name: Package
        run: |
          d=r2fuse-$VERSION-macos-arm64
          python3 dist/package-macos.py r2fuse "$d" /usr/local/lib
          cp README.md LICENSE FSTODO.md "$d/"
          "$d/r2fuse" -v
          "$d/r2fuse" -L
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: r2fuse-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Install build tools
        run: |
          pip install meson ninja
          choco install winfsp -y
      - name: Install radare2 release
        id: r2
        uses: radareorg/github-actions@v3
      - name: Build r2fuse
        shell: pwsh
        run: |
          meson setup build --buildtype=release "-Dr2_prefix=${{ steps.r2.outputs.prefix }}" -Db_vscrt=mt -Dc_std=c11 -Dc_args=/Zc:preprocessor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson compile -C build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dumpbin /dependents build\r2fuse.exe
      - name: Package
        shell: pwsh
        run: |
          $d = "r2fuse-$env:VERSION-windows-x64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item build\r2fuse.exe, README.md, LICENSE, FSTODO.md $d
          foreach ($lib in 'r_fs', 'r_io', 'r_util', 'r_cons', 'r_socket', 'r_muta') {
            Copy-Item "${{ steps.r2.outputs.prefix }}/bin/$lib.dll" $d
          }
          $runtime = Get-ChildItem "$env:VCINSTALLDIR/Redist/MSVC/*/x64/Microsoft.VC*.CRT/vcruntime140.dll" | Select-Object -First 1
          if (!$runtime) { throw 'Cannot find the redistributable Visual C++ runtime' }
          Copy-Item $runtime.FullName $d
          # Only the packaged DLLs should supply radare2 at runtime.
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          & "$PWD/$d/r2fuse.exe" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$PWD/$d/r2fuse.exe" -L
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: r2fuse-*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check release assets and generate checksums
        working-directory: dist
        run: |
          test -s r2fuse-$VERSION-linux-x86_64.tar.gz
          test -s r2fuse-$VERSION-linux-arm64.tar.gz
          test -s r2fuse-$VERSION-macos-arm64.tar.gz
          test -s r2fuse-$VERSION-windows-x64.zip
          sha256sum r2fuse-*.tar.gz r2fuse-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: r2fuse ${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
